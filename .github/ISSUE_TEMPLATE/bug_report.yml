name: Bug report
description: Something does not behave as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
      description: The tag or commit you installed, for example `v0.1.0`.
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.12"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact output or error message.
    validations:
      required: true
